{% set versions = {
    "1.1.0": "ca3e027f078438318bd4143a102aebc2d51358f537b5d52bbc574fe49a6a901e"
} %}

{% set version = environ.get('COMMIT_VERSION', None) %}
{% set version = version or versions.keys()|first %}
{% set version = version|string %}

{% set name = environ.get('ANACONDA_PACKAGE', 'iregi')|string|lower %}

package:
  name: {{ name }}
  version: {{ environ.get('ANACONDA_VERSION', version)|replace("-", ".") }}

source:
  # IREGI's source only exists vendored inside the MG5_aMC@NLO release tarball
  url: "https://launchpad.net/mg5amcnlo/lts/lts.3.5.x/+download/MG5_aMC_v3.5.7.tar.gz"
  {% if versions.get(version, None) %}
  sha256: {{ versions.get(version) }}
  {% endif %}
  patches:
    # Don't build everything the default makefile_ML5_lib target pulls in
    - makefile_ML5_lib.patch
    # mg5amcnlo's mis_warp.f90 expects 'avh_olo_forIREGI' instead of 'avh_olo'
    - use-avh_olo.patch

build:
  number: 1

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('fortran') }}
    - make
    - libtool
  host:
    - oneloop

test:
  commands:
    - test -f $PREFIX/lib/libiregi.a
    - test -f $PREFIX/include/iregi/global.mod

about:
  home: "https://github.com/mg5amcnlo/mg5amcnlo/tree/3.x/vendor/IREGI/src"
  license: "NCSA"
  license_file: LICENSE
  summary: "IREGI: dimensional regularization library vendored from MadGraph5_aMC@NLO"
  description: |
    IREGI (one-loop tensor Integral REduction with General propagator
    Indices) implements the Duplancic-Nizic reduction algorithm for
    MADLOOP5 in MadGraph5_aMC@NLO. Its source only exists vendored inside
    the mg5amcnlo repository, so it's built from the full release tarball.

extra:
  recipe-maintainers:
    - meiyasan
